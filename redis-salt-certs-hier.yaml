---

names:
  FastMS:
    country_name: RU
    state_or_province_name: Central Federal District
    locality_name: Moscow
    organization_name: FastMS
    common_name: redis-salt

certs:
  /mnt/certs/ca.crt:
    subject: FastMS
    not_valid_after_days: null
    key_password: null
    basic_constraints:
      ca: true
      path_length: 0  # No further CA certificates
    issue:
      /mnt/certs/redis.crt:
        subject: FastMS
        not_valid_after_days: null
        key_password: null
        basic_constraints:
          ca: false
          path_length: null
        alternative_names_ip:
          - '127.0.0.1'
        alternative_names_dns:
          - localhost
          - redis-salt
        extended_key_usage:
          server: true
          client: false
