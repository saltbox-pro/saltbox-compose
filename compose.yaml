x-default-service: &default
  restart: 'on-failure'
  stop_grace_period: ${STOP_GRACE_PERIOD}

name: fastms-compose

services:
  proxy:
    <<: *default
    build:
      context: proxy/
    develop:
      watch:
        - action: rebuild
          path: proxy/
    environment:
      API_BASE_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${BACKEND_PATH}'
      BACKEND_HOSTNAME: fastms-core
      BACKEND_HTTP_PORT: '${BACKEND_HTTP_PORT}'
      BACKEND_PATH: '${BACKEND_PATH}'
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
      OPEN_ID_AUTHORITY: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}'
      OPEN_ID_CLIENT_ID: '${KEYCLOAK_CLIENT}'
      OPEN_ID_REDIRECT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}'
      WS_SERVER_URL: '${WEB_SERVER_WS_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${BACKEND_PATH}'
      WEB_SERVER_WS_SCHEME: '${WEB_SERVER_WS_SCHEME}'
      WEB_SERVER_SCHEME: '${WEB_SERVER_SCHEME}'
    ports:
      - '${WEB_SERVER_PORT}:80'
    secrets:
      - keycloak_client_fastms_core_password

  keycloak-db:
    <<: *default
    image: postgres:16-alpine
    volumes:
      - 'keycloak-db_data:/var/lib/postgresql/data/'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_database_password
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
    secrets:
      - keycloak_database_password
    expose:
      - 5432

  keycloak:
    <<: *default
    build:
      context: keycloak
      target: keycloak
      args:
        KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_BASE_URL}
    develop:
      watch:
        - action: rebuild
          path: keycloak/
    command:
      - 'start'
      - '--optimized'
    environment:
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DATABASE}'
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_BACKCHANNEL: '${KEYCLOAK_STRICT_HTTPS-true}'
      KC_HOSTNAME_STRICT_HTTPS: '${KEYCLOAK_STRICT_HTTPS-true}'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
    secrets:
      - keycloak_admin_password
      - keycloak_database_password
    depends_on:
      keycloak-db:
        condition: service_started

  keycloak-init:
    <<: *default
    build:
      context: keycloak
      target: keycloak-init
    environment:
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_USER_EMAIL: '${KEYCLOAK_USER_EMAIL}'
      KEYCLOAK_USER_FIRSTNAME: '${KEYCLOAK_USER_FIRSTNAME}'
      KEYCLOAK_USER_LASTNAME: '${KEYCLOAK_USER_LASTNAME}'
      KEYCLOAK_USER_NAME: '${KEYCLOAK_USER_NAME}'
    secrets:
      - keycloak_admin_password
      - keycloak_client_fastms_core_password
      - keycloak_user_password
    depends_on:
      keycloak:
        condition: service_healthy

  salt-master:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-compose/salt-master:master'
    init: true
    environment:
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      SALT_API_LOG_LEVEL: '${SALT_API_LOG_LEVEL}'
      SALT_API_USER: '${SALT_API_USER}'
      SALT_MASTER_LOG_LEVEL: '${SALT_MASTER_LOG_LEVEL}'
    secrets:
      - salt_api_password
      - redis_salt_password
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    profiles:
      - salt-master
    depends_on:
      redis-salt:
        condition: service_started
        restart: false  # TODO Subject to decide

  make-redis-salt-certs:
    <<: *default
    build:
      context: make-certs
      args:
        IMAGE: '${IMAGE_REGISTRY}/make-certs:master'
    command:
      - '/root/hier.yaml'
    volumes:
      - 'redis_salt_certs:/mnt/redis_certs/'
    secrets:
      - redis_salt_ca_private_key_password
      - redis_salt_private_key_password

  redis-salt:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-compose/redis:master'
    environment:
      REDIS_ENCRYPTION: 'on'
      TLS_AUTH_CLIENT: optional
      REDIS_USERNAME: ${REDIS_SALT_USERNAME}
      REDIS_PASSWORD_SECRET: '/run/secrets/redis_salt_password'
      REDIS_PRIVATE_KEY_PASSWORD_SECRET: '/run/secrets/redis_salt_private_key_password'
    command:
      - --save 60 1
    volumes:
      - 'redis_salt_data:/data/'
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    expose:
      - 6379
    ports:
      - '${REDIS_SALT_OUTER_SOCKET}:6379'
    secrets:
      - redis_salt_password
      - redis_salt_private_key_password
    depends_on:
      - make-redis-salt-certs

  redis-celery:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-compose/redis:master'
    environment:
      REDIS_ENCRYPTION: 'off'
      REDIS_USERNAME: ${REDIS_CELERY_USERNAME}
      REDIS_PASSWORD_SECRET: '/run/secrets/redis_celery_password'
    command:
      - --save 60 1
    volumes:
      - 'redis_celery_data:/data/'
    expose:
      - 6379
    secrets:
      - redis_celery_password

  fastms-core: &core
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-core:${CORE_IMAGE_TAG}'
    environment:
      BASE_URL_ROOT_PATH: '${BACKEND_PATH}'
      MONGO_DB: '${MONGO_DB}'
      MONGO_USER: '${MONGO_USER}'
      REDIS_CA_CERT: '/etc/redis/certs/ca.crt'
      REDIS_CELERY_DB: 0
      REDIS_CELERY_HOST: redis-celery
      REDIS_CELERY_PASSWORD_SECRET: '/run/secrets/redis_celery_password'
      REDIS_CELERY_PORT: 6379
      REDIS_CELERY_USERNAME: '${REDIS_CELERY_USERNAME}'
      REDIS_URL: 'rediss://redis-salt:6379/0'
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      SALT_EAUTH: file
      SALT_URL: 'https://salt-master:8000'
      SALT_USERNAME: '${SALT_API_USER}'
      TIMEOUT_GRACEFUL_SHUTDOWN: '${BACKEND_SHUTDOWN_TIMEOUT_SEC}'
      KEYCLOAK_SERVER_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_REALM_NAME: '${KEYCLOAK_REALM}'
    volumes:
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
      - 'fastms_core_var:/var/fastms-core/'
    secrets:
      - salt_api_password
      - redis_celery_password
      - redis_salt_password
      - mongo_admin_password
    expose:
      - ${BACKEND_HTTP_PORT}
    depends_on:
      mongo:
        condition: service_started
        restart: false

  fastms-core-celery-beat:
    <<: *core
    entrypoint: '/usr/local/bin/celery-beat.sh'
    expose: []
    depends_on:
      redis-celery:
        condition: service_started
        restart: false

  fastms-core-celery-worker-tasks:
    <<: *core
    entrypoint: '/usr/local/bin/celery-worker.sh'
    command:
      - 'tasks'
      - '--concurrency 4'
    expose: []
    depends_on:
      redis-celery:
        condition: service_started
        restart: false

  fastms-frontend:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-frontend:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    <<: *default
    image: mongo:7
    command: --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin_password
    secrets:
      - mongo_admin_password

configs: {}

volumes:
  fastms_core_var: {}
  keycloak-db_data: {}
  redis_salt_certs: {}
  redis_salt_data: {}
  redis_celery_certs: {}
  redis_celery_data: {}
  salt_master_pki: {}

secrets:
  # BUILD TIME secrets
  keycloak_admin_password:
    file: secrets/keycloak_admin_password
  keycloak_client_fastms_core_password:  # Not private: exposed in /env.json
    file: secrets/keycloak_client_fastms_core_password
  # RUNTIME secrets
  keycloak_database_password:
    file: secrets/keycloak_database_password
  keycloak_user_password:
    file: secrets/keycloak_user_password
  mongo_admin_password:
    file: secrets/mongo_admin_password
  salt_api_password:
    file: secrets/salt_api_password
  redis_salt_password:
    file: secrets/redis_salt_password
  redis_salt_ca_private_key_password:
    file: secrets/redis_salt_ca_private_key_password
  redis_salt_private_key_password:
    file: secrets/redis_salt_private_key_password
  redis_celery_password:
    file: secrets/redis_celery_password
