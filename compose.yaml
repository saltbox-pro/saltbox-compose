x-default-service: &default
  restart: unless-stopped
  env_file:
    - .env

services:
  proxy:
    <<: *default
    build:
      context: proxy/
    develop:
      watch:
        - action: rebuild
          path: proxy/
    environment:
      BACKEND_HOSTNAME: fastms-core
    ports:
      - '${GLOBAL_PUBLIC_PORT}:80'
    depends_on:
      - fastms-core
      - fastms-frontend
      - keycloak

  keycloak-db:
    <<: *default
    image: postgres:16-alpine
    volumes:
      - 'keycloak-db_data:/var/lib/postgresql/data/'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_database_password
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
    secrets:
      - keycloak_database_password
    expose:
      - 5432

  keycloak:
    <<: *default
    build:
      context: keycloak
      args:
        KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_BASE_URL}
    develop:
      watch:
        - action: rebuild
          path: keycloak/
    # FIXME Get realm secrets
    command: start --optimized --import-realm
    environment:
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DATABASE}'
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_HOSTNAME_STRICT: false
      KEYCLOAK_ADMIN: admin
    secrets:
      - keycloak_admin_password
      - keycloak_database_password
    expose:
      - 8080
    depends_on:
      - keycloak-db

  salt-master:
    <<: *default
    build:
      context: salt/
      target: salt-master
    image: fastms-salt-master
    init: true
    develop:
      watch:
        - action: rebuild
          path: salt/
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
    depends_on:
      - redis-salt

  redis-salt:
    <<: *default
    image: redis:7.2-alpine
    command:
      - --save 60 1
    volumes:
      - 'redis_salt_data:/data/'
    expose:
      - 6379

  fastms-core:
    <<: *default
    build:
      context: fastms-core/
    develop:
      watch:
        - action: rebuild
          path: fastms-core/
    environment:
      SALT_URL: 'https://salt-master:8000'
      REDIS_URL: 'redis://redis-salt:6379/0'
      ROOT_PATH: ${BACKEND_BASE_URL}
      TIMEOUT_GRACEFUL_SHUTDOWN: ${BACKEND_SHUTDOWN_TIMEOUT_SEC}
    expose:
      - ${BACKEND_HTTP_PORT}
    depends_on:
      - mongo
      - keycloak  # TODO Must be ready, see 'service_started' option

  fastms-frontend:
    <<: *default
    build:
      context: fastms-frontend/
      args:
        VITE_API_URL_HTTP: 'http://${FRONTEND_SERVER_NAME}${BACKEND_BASE_URL}'
        VITE_API_URL_WS: 'ws://${FRONTEND_SERVER_NAME}${BACKEND_BASE_URL}'
    develop:
      watch:
        - action: rebuild
          path: fastms-frontend/
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    <<: *default
    image: mongo:7
    command: --quiet
    environment:
      # FIXME Generate
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  salt_master_pki: {}
  redis_salt_data: {}
  keycloak-db_data: {}

secrets:
  # FIXME FastMS Core SALT_PASSWORD
  keycloak_admin_password:
    file: secrets/keycloak_admin_password
  keycloak_database_password:
    file: secrets/keycloak_database_password
