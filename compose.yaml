services:
  salt-master:
    build:
      context: salt/
      target: salt-master
    image: fastms-salt-master
    init: true
    container_name: fastms-salt-master
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
    depends_on:
      - redis-salt
  redis-salt:
    image: redis:7.2-alpine
    container_name: fastms-redis-salt
    command:
      - --save 60 1
    volumes:
      - 'redis_salt_data:/data/'
  fastms-core:
    build:
      context: fastms-core/
    container_name: fastms-core
    env_file:
      - .env
    environment:
      SALT_URL: 'https://fastms-salt-master:8000'
      REDIS_URL: 'redis://fastms-redis-salt:6379/0'
    ports:
      - '${BACKEND_HTTP_PORT}:8000'
    restart: no
    depends_on:
      - mongo
  fastms-frontend:
    build:
      context: fastms-frontend/
      args:
        VITE_API_URL_HTTP: 'http://${SERVER_NAME}:${SERVER_PORT}'
        VITE_API_URL_WS: 'ws://${SERVER_NAME}:${SERVER_PORT}'
    develop:
      watch:
        - action: rebuild
          path: fastms-frontend/
    container_name: fastms-frontend
    env_file:
      - .env
    ports:
      - '${FRONTEND_HTTP_PORT}:80'
  mongo:
    image: mongo:7
    command: --quiet
    environment:
      # TODO Generate
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
volumes:
  salt_master_pki: {}
  redis_salt_data: {}
