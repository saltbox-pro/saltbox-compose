x-default-service: &default
  restart: 'on-failure'
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  proxy:
    <<: *default
    build:
      context: proxy/
      args:
        IMAGE: '${IMAGE_REGISTRY}/saltbox-compose/nginx:${NGINX_IMAGE_TAG}'
    develop:
      watch:
        - action: rebuild
          path: proxy/
    environment:
      API_BASE_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${BACKEND_PATH}'
      BACKEND_HOSTNAME: saltbox-core
      BACKEND_HTTP_PORT: '${BACKEND_HTTP_PORT}'
      BACKEND_PATH: '${BACKEND_PATH}'
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
      OPEN_ID_AUTHORITY: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}'
      OPEN_ID_CLIENT_ID: '${KEYCLOAK_CLIENT}'
      OPEN_ID_REDIRECT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}'
      WS_SERVER_URL: '${WEB_SERVER_WS_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${BACKEND_PATH}'
      WEB_SERVER_WS_SCHEME: '${WEB_SERVER_WS_SCHEME}'
      WEB_SERVER_SCHEME: '${WEB_SERVER_SCHEME}'
    ports:
      - '${WEB_SERVER_PORT}:80'
    secrets:
      - keycloak_client_salt_box_core_password
    depends_on:
      saltbox-core:
        condition: service_started
        restart: false
      saltbox-frontend:
        condition: service_started
        restart: false
      keycloak:
        condition: service_started
        restart: false

  keycloak-db:
    <<: *default
    image: postgres:16-alpine
    volumes:
      - 'keycloak-db_data:/var/lib/postgresql/data/'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_database_password
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
    healthcheck:
      test:
        - CMD-SHELL
        - su
        - postgres
        - '-c'
        - pg_isready
        - '--username'
        - '{KEYCLOAK_DATABASE_USER}'
        - '--dbname'
        - '${KEYCLOAK_DATABASE}'
      interval: '5s'
      retries: 5
      start_period: '10s'
    secrets:
      - keycloak_database_password
    expose:
      - 5432

  keycloak:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/keycloak:${KEYCLOAK_IMAGE_TAG}'
    command:
      - 'start'
      - '--optimized'
    environment:
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DATABASE}'
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_HOSTNAME_STRICT: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
    secrets:
      - keycloak_admin_password
      - keycloak_database_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-init:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/keycloak-init:${KEYCLOAK_IMAGE_TAG}'
    environment:
      KEYCLOAK_ADMIN_EMAIL: '${KEYCLOAK_ADMIN_EMAIL}'
      KEYCLOAK_ADMIN_FIRSTNAME: '${KEYCLOAK_ADMIN_FIRSTNAME}'
      KEYCLOAK_ADMIN_LASTNAME: '${KEYCLOAK_ADMIN_LASTNAME}'
      KEYCLOAK_ADMIN_NAME: '${KEYCLOAK_ADMIN_NAME}'
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      KEYCLOAK_CLIENT_DIRECT_ACCESS: '${KEYCLOAK_CLIENT_DIRECT_ACCESS:-false}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_USER_EMAIL: '${KEYCLOAK_USER_EMAIL}'
      KEYCLOAK_USER_FIRSTNAME: '${KEYCLOAK_USER_FIRSTNAME}'
      KEYCLOAK_USER_LASTNAME: '${KEYCLOAK_USER_LASTNAME}'
      KEYCLOAK_USER_NAME: '${KEYCLOAK_USER_NAME}'
    secrets:
      - keycloak_admin_password
      - keycloak_client_salt_box_core_password
      - salt_box_admin_password
      - salt_box_user_password
    depends_on:
      keycloak:
        condition: service_healthy
        restart: false

  salt-master:
    <<: *default
    profiles:
      - salt-master
    image: '${IMAGE_REGISTRY}/saltbox-bridge/salt-master:${SALT_MASTER_IMAGE_TAG}'
    init: true
    environment:
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      REDIS_PASSWORD_FILE: '/run/secrets/redis_salt_password'
      MASTER_SECRET_FILE: '/run/secrets/master_secret'
      SALT_MASTER_LOG_LEVEL: '${SALT_MASTER_LOG_LEVEL}'
      SALT_MINION_LOG_LEVEL: '${SALT_MINION_LOG_LEVEL}'
    secrets:
      - redis_salt_password
      - master_secret
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - './salt/master_gitfs.conf:/etc/salt/master.d/master_gitfs.conf'
      - '${SALT_MASTER_STORAGE_PATH}:/srv/salt/'
      - 'salt_master_pki:/etc/salt/pki/'
      - 'salt_master_saltbox_var:/var/lib/saltbox-bridge/'
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    #depends_on:
    ## FIXME Well yes, but actually no
    ## Bridge engine raises exception, but should just inform and exit or retry
    ## to connect by itself.
    #  redis-salt:
    #    condition: service_healthy
    #    restart: false

  make-redis-salt-certs:
    <<: *default
    build:
      context: make-certs
      args:
        IMAGE: '${IMAGE_REGISTRY}/make-certs:v0.2.1'
    command:
      - '/root/hier.yaml'
    volumes:
      - 'redis_salt_certs:/mnt/redis_certs/'
    secrets:
      - redis_salt_ca_private_key_password
      - redis_salt_private_key_password

  redis-salt:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/redis:${REDIS_IMAGE_TAG}'
    environment:
      REDIS_ENCRYPTION: 'on'
      TLS_AUTH_CLIENT: optional
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      REDIS_PASSWORD_SECRET_FILE: '/run/secrets/redis_salt_password'
      REDIS_PRIVATE_KEY_PASSWORD_SECRET: '/run/secrets/redis_salt_private_key_password'
    command:
      - --save 60 1
    healthcheck:
      test: >
        redis-cli --tls
        --user ${REDIS_SALT_USERNAME}
        --pass "$(cat "$$REDIS_PASSWORD_SECRET_FILE")"
        --cacert /etc/redis/certs/ca.crt ping
      start_period: '20s'
      start_interval: '2s'
      interval: '15s'
      retries: 3
    volumes:
      - 'redis_salt_data:/data/'
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    expose:
      - 6379
    ports:
      - '${REDIS_SALT_EXPOSE_SOCKET}:6379'
    secrets:
      - redis_salt_password
      - redis_salt_private_key_password
    depends_on:
      - make-redis-salt-certs

  redis-taskiq:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/redis:${REDIS_IMAGE_TAG}'
    environment:
      REDIS_ENCRYPTION: 'off'
      REDIS_USERNAME: ${REDIS_TASKIQ_USERNAME}
      REDIS_PASSWORD_SECRET_FILE: '/run/secrets/redis_password'
    command:
      - --save 60 1
    volumes:
      - 'redis_taskiq_data:/data/'
    expose:
      - 6379
    secrets:
      - redis_password

  rabbitmq:
    <<: *default
    image: rabbitmq:3-management
    expose:
      - 5672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  saltbox-core: &core
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-core:${CORE_IMAGE_TAG}'
    environment:
      LOCAL_REPOS_PATH: '/mnt/repos/'
      BASE_URL_ROOT_PATH: '${BACKEND_PATH}'
      MONGO_DB: '${MONGO_DB}'
      MONGO_USER: '${MONGO_USER}'
      REDIS_CA_CERT: '/etc/redis/certs/ca.crt'
      REDIS_TASKIQ_DB: 0
      REDIS_TASKIQ_HOST: redis-taskiq
      REDIS_TASKIQ_PASSWORD_SECRET: '/run/secrets/redis_taskiq_password'
      REDIS_TASKIQ_PORT: 6379
      REDIS_TASKIQ_USERNAME: '${REDIS_TASKIQ_USERNAME}'
      REDIS_URL: 'rediss://redis-salt:6379/0'
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      TIMEOUT_GRACEFUL_SHUTDOWN: '${BACKEND_SHUTDOWN_TIMEOUT_SEC}'
      KEYCLOAK_SERVER_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_FRONT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      # OPA_URL: 'http://opal_client:8181'
      OPA_URL: 'http://opa:8181'
    volumes:
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
      - 'saltbox_core_var:/var/lib/saltbox-core/'
      - 'salt_repos:/mnt/repos/'
    secrets:
      - redis_taskiq_password
      - redis_salt_password
      - mongo_admin_password
    expose:
      - ${BACKEND_HTTP_PORT}
    depends_on:
      mongo:
        condition: service_started
        restart: false
      redis-salt:
        condition: service_healthy
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-faststream-redis:
    <<: *core
    entrypoint: 'entrypoint.sh saltbox-faststream-redis'
    expose: []
    depends_on:
      redis-salt:
        condition: service_started
        restart: false

  saltbox-core-tasks-watcher:
    <<: *core
    entrypoint: 'entrypoint.sh saltbox-tasks-watcher'
    expose: []
    depends_on:
      redis-salt:
        condition: service_started
        restart: false

  saltbox-core-taskiq-worker:
    <<: *core
    entrypoint: '/usr/local/bin/taskiq-worker.sh'
    ports: []
    depends_on:
      redis-taskiq:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-taskiq-scheduler:
    <<: *core
    entrypoint: '/usr/local/bin/taskiq-scheduler.sh'
    ports: []
    depends_on:
      redis-taskiq:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-frontend:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-frontend:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    <<: *default
    image: mongo:7
    command: --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin_password
    ports:
      - '${MONGO_EXPOSE_SOCKET}:27017'
    volumes:
      - mongo_config:/data/configdb
      - mongo_data:/data/db
    secrets:
      - mongo_admin_password

  opa:
    image: '${IMAGE_REGISTRY}/saltbox-compose/opa:${OPA_IMAGE_TAG}'
    command:
      - 'run'
      - '--server'
      - '--addr=0.0.0.0:8181'
      - '--watch'
      - '--log-format=json-pretty'
      - '--log-level=${OPA_LOG_LEVEL:-info}'
      - '--set=decision_logs.console=false'
      - '/policies/'
    ports:
      - '8181:8181'

  sshfs:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/sshfs:${SSHFS_IMAGE_TAG}'
    environment:
      SSHFS_USER: '${SSHFS_USER}'
      USERS_FILE: '/mnt/sshfs_users.json'
    secrets:
      - sshfs_user_saltbox_password
      - sshfs_user_git_password
    ports:
      - '${SSHFS_EXPOSE_SOCKET:-1022}:1022'
    volumes:
      - '${SSHFS_STORAGE_PATH}:/srv/sshfs/'
      - 'salt_repos:/srv/git/'
      - './sshfs_conf/users.json:/mnt/sshfs_users.json:ro'
      - './sshfs_conf/gitconfig:/srv/git/.gitconfig:ro'

configs: {}

volumes:
  keycloak-db_data: {}
  mongo_config: {}
  mongo_data: {}
  redis_salt_certs: {}
  redis_salt_data: {}
  redis_taskiq_certs: {}
  redis_taskiq_data: {}
  salt_master_pki: {}
  salt_master_saltbox_var: {}
  salt_repos: {}
  saltbox_core_var: {}

secrets:
  keycloak_admin_password:
    file: secrets/keycloak_admin_password
  keycloak_client_salt_box_core_password:  # Not private: exposed in /env.json
    file: secrets/keycloak_client_salt_box_core_password
  keycloak_database_password:
    file: secrets/keycloak_database_password
  mongo_admin_password:
    file: secrets/mongo_admin_password
  salt_box_admin_password:
    file: secrets/salt_box_user_password
  salt_box_user_password:
    file: secrets/salt_box_user_password
  sshfs_user_saltbox_password:
    file: secrets/sshfs_user_saltbox_password
  sshfs_user_git_password:
    file: secrets/sshfs_user_git_password
  redis_salt_password:
    file: secrets/redis_salt_password
  redis_salt_ca_private_key_password:
    file: secrets/redis_salt_ca_private_key_password
  redis_salt_private_key_password:
    file: secrets/redis_salt_private_key_password
  master_secret:
    file: secrets/master_secret
  redis_taskiq_password:
    file: secrets/redis_taskiq_password
  redis_password:
    file: secrets/redis_taskiq_password
  redis_private_key_password:
    file: secrets/redis_salt_private_key_password
