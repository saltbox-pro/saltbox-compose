services:
  proxy:
    build:
      context: nginx-proxy/
    container_name: proxy
    develop:
      watch:
        - action: rebuild
          path: nginx-proxy/
    env_file:
      - .env
    environment:
      BACKEND_HOSTNAME: fastms-core
    ports:
      - '80:80'
    depends_on:
      - fastms-core
      - fastms-frontend
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start --optimized
    env_file:
      - .env
    environment:
      KC_HOSTNAME: 'http://localhost${KEYCLOAK_BASE_URL}'
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: '/auth/keycloak'
      KC_LOG_LEVEL: info
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    expose:
      - 8080

  salt-master:
    build:
      context: salt/
      target: salt-master
    image: fastms-salt-master
    init: true
    develop:
      watch:
        - action: rebuild
          path: salt/
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
    depends_on:
      - redis-salt

  redis-salt:
    image: redis:7.2-alpine
    command:
      - --save 60 1
    volumes:
      - 'redis_salt_data:/data/'

  fastms-core:
    build:
      context: fastms-core/
    develop:
      watch:
        - action: rebuild
          path: fastms-core/
    env_file:
      - .env
    environment:
      SALT_URL: 'https://salt-master:8000'
      REDIS_URL: 'redis://redis-salt:6379/0'
      ROOT_PATH: ${BACKEND_BASE_URL}
      TIMEOUT_GRACEFUL_SHUTDOWN: ${BACKEND_SHUTDOWN_TIMEOUT_SEC}
    expose:
      - ${BACKEND_HTTP_PORT}
    restart: no
    depends_on:
      - mongo
      - keycloak  # FIXME Must be ready, see 'service_started' option

  fastms-frontend:
    build:
      context: fastms-frontend/
      args:
        VITE_API_URL_HTTP: 'http://${FRONTEND_SERVER_NAME}${BACKEND_BASE_URL}'
        VITE_API_URL_WS: 'ws://${FRONTEND_SERVER_NAME}${BACKEND_BASE_URL}'
    develop:
      watch:
        - action: rebuild
          path: fastms-frontend/
    env_file:
      - .env
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    image: mongo:7
    command: --quiet
    environment:
      # TODO Generate
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  salt_master_pki: {}
  redis_salt_data: {}
