x-default-service: &default
  restart: unless-stopped
  stop_grace_period: ${STOP_GRACE_PERIOD}
  env_file:
    - .env

name: fastms-compose

services:
  proxy:
    <<: *default
    build:
      context: proxy/
    develop:
      watch:
        - action: rebuild
          path: proxy/
    environment:
      BACKEND_HOSTNAME: fastms-core
      API_BASE_URL: 'http://${BACKEND_HOST}${BACKEND_BASE_URL}'
      WS_SERVER_URL: 'ws://${BACKEND_HOST}${BACKEND_BASE_URL}'
      OPEN_ID_AUTHORITY: 'http://${BACKEND_HOST}${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}'
      OPEN_ID_CLIENT_ID: ${KEYCLOAK_CLIENT}
      OPEN_ID_REDIRECT_URL: ${FRONTEND_OPEN_ID_REDIRECT_URL}
    ports:
      - '${GLOBAL_PUBLIC_PORT}:80'
    depends_on:
      - fastms-core
      - fastms-frontend
      - keycloak
    secrets:
      - keycloak_client_fastms_core_password

  keycloak-db:
    <<: *default
    image: postgres:16-alpine
    volumes:
      - 'keycloak-db_data:/var/lib/postgresql/data/'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_database_password
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
    secrets:
      - keycloak_database_password
    expose:
      - 5432

  keycloak:
    <<: *default
    build:
      context: keycloak
      target: keycloak
      args:
        KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_BASE_URL}
    develop:
      watch:
        - action: rebuild
          path: keycloak/
    command: start --optimized
    environment:
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DATABASE}'
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_HOSTNAME_STRICT: false
      KEYCLOAK_ADMIN: admin
    secrets:
      - keycloak_admin_password
      - keycloak_database_password
    depends_on:
      keycloak-db:
        condition: service_started

  keycloak-init:
    <<: *default
    build:
      context: keycloak
      target: keycloak-init
    restart: on-failure
    environment:
      KEYCLOAK_URL: "http://keycloak:8080${KEYCLOAK_BASE_URL}"
    secrets:
      - keycloak_admin_password
      - keycloak_client_fastms_core_password
    depends_on:
      keycloak:
        condition: service_healthy

  salt-master:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-compose/salt-master:master'
    init: true
    develop:
      watch:
        - action: rebuild
          path: salt/
    secrets:
      - salt_api_password
      - redis_salt_password
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
    depends_on:
      - redis-salt

  redis-salt:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-compose/redis:master'
    command:
      - --save 60 1
    volumes:
      - 'redis_salt_data:/data/'
    expose:
      - 6379
    secrets:
      - redis_salt_password

  fastms-core:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-core:${CORE_IMAGE_TAG}'
    environment:
      SALT_URL: 'https://salt-master:8000'
      SALT_USER: ${SALT_API_USER}
      REDIS_URL: 'redis://redis-salt:6379/0'
      BASE_URL_ROOT_PATH: ${BACKEND_BASE_URL}
      TIMEOUT_GRACEFUL_SHUTDOWN: ${BACKEND_SHUTDOWN_TIMEOUT_SEC}
      MONGO_USER: ${MONGO_USER}
      MONGO_DB: ${MONGO_DB}
    secrets:
      - salt_api_password
      - mongo_admin_password
    expose:
      - ${BACKEND_HTTP_PORT}
    depends_on:
      keycloak:
        condition: service_healthy
      mongo:
        condition: service_started

  fastms-frontend:
    <<: *default
    image: '${IMAGE_REGISTRY}/fastms-frontend:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    <<: *default
    image: mongo:7
    command: --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin_password
    secrets:
      - mongo_admin_password

volumes:
  salt_master_pki: {}
  redis_salt_data: {}
  keycloak-db_data: {}

secrets:
  # BUILD TIME secrets
  keycloak_admin_password:
    file: secrets/keycloak_admin_password
  keycloak_client_fastms_core_password:  # Not private: exposed in /env.json
    file: secrets/keycloak_client_fastms_core_password
  # RUNTIME secrets
  keycloak_database_password:
    file: secrets/keycloak_database_password
  mongo_admin_password:
    file: secrets/mongo_admin_password
  salt_api_password:
    file: secrets/salt_api_password
  redis_salt_password:
    file: secrets/redis_salt_password
