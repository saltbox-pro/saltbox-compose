x-default-service: &default
  restart: 'on-failure'
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  proxy:
    <<: *default
    build:
      context: proxy/
      args:
        IMAGE: '${IMAGE_REGISTRY}/saltbox-compose/nginx:${NGINX_IMAGE_TAG}'
    environment:
      API_BASE_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${GATEWAY_PATH}'
      BACKEND_HOSTNAME: saltbox-core
      GATEWAY_HTTP_PORT: '${GATEWAY_HTTP_PORT}'
      BACKEND_HTTP_PORT: '${BACKEND_HTTP_PORT}'
      BACKEND_PATH: '${BACKEND_PATH}'
      GATEWAY_PATH: '${GATEWAY_PATH}'
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
      OPEN_ID_AUTHORITY: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}'
      OPEN_ID_CLIENT_ID: '${KEYCLOAK_CLIENT}'
      OPEN_ID_REDIRECT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}'
      WS_SERVER_URL: '${WEB_SERVER_WS_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${BACKEND_PATH}'
      WEB_SERVER_WS_SCHEME: '${WEB_SERVER_WS_SCHEME}'
      WEB_SERVER_SCHEME: '${WEB_SERVER_SCHEME}'
    ports:
      - '${WEB_SERVER_PORT}:80'
    secrets:
      - keycloak_client_saltbox_core_password
    depends_on:
      saltbox-core:
        condition: service_started
        restart: false
      saltbox-frontend-root-config:
        condition: service_started
        restart: false
      keycloak:
        condition: service_started
        restart: false

  keycloak-db:
    <<: *default
    image: postgres:16-alpine
    volumes:
      - 'keycloak-db_data:/var/lib/postgresql/data/'
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_database_password
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER}
    healthcheck:
      test:
        - CMD-SHELL
        - su
        - postgres
        - '-c'
        - pg_isready
        - '--username'
        - '{KEYCLOAK_DATABASE_USER}'
        - '--dbname'
        - '${KEYCLOAK_DATABASE}'
      interval: '5s'
      retries: 5
      start_period: '10s'
    secrets:
      - keycloak_database_password
    expose:
      - 5432

  keycloak:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/keycloak:${KEYCLOAK_IMAGE_TAG}'
    command:
      - 'start'
      - '--optimized'
      - '--hostname=${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}'
      - '--hostname-backchannel-dynamic=true'
    environment:
      KC_DB_URL: 'jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DATABASE}'
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_HOSTNAME_STRICT: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_BASE_URL: '${KEYCLOAK_BASE_URL}'
    secrets:
      - keycloak_admin_password
      - keycloak_database_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-init:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/keycloak-init:${KEYCLOAK_IMAGE_TAG}'
    environment:
      KEYCLOAK_ADMIN_EMAIL: '${SALTBOX_ADMIN_EMAIL}'

      KEYCLOAK_ADMIN_FIRSTNAME: '${SALTBOX_ADMIN_FIRSTNAME}'
      KEYCLOAK_ADMIN_LASTNAME: '${SALTBOX_ADMIN_LASTNAME}'
      KEYCLOAK_ADMIN_NAME: '${SALTBOX_ADMIN_USERNAME}'
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      KEYCLOAK_CLIENT_GRAFANA: '${KEYCLOAK_CLIENT_GRAFANA}'
      KEYCLOAK_CLIENT_DIRECT_ACCESS: '${KEYCLOAK_CLIENT_DIRECT_ACCESS:-false}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_USER_EMAIL: '${SALTBOX_USER_EMAIL}'
      KEYCLOAK_USER_FIRSTNAME: '${SALTBOX_USER_FIRSTNAME}'
      KEYCLOAK_USER_LASTNAME: '${SALTBOX_USER_LASTNAME}'
      KEYCLOAK_USER_NAME: '${SALTBOX_USER_USERNAME}'
    secrets:
      - keycloak_admin_password
      - keycloak_client_saltbox_core_password
      - keycloak_client_grafana_password
      - saltbox_admin_password
      - saltbox_user_password
    depends_on:
      keycloak:
        condition: service_healthy
        restart: false

  salt-master:
    <<: *default
    profiles:
      - salt-master
    image: '${IMAGE_REGISTRY}/saltbox-bridge/salt-master:${SALT_MASTER_IMAGE_TAG}'
    init: true
    environment:
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      REDIS_PASSWORD_FILE: '/run/secrets/redis_salt_password'
      SALT_MASTER_LOG_LEVEL: '${SALT_MASTER_LOG_LEVEL}'
      SALT_MINION_LOG_LEVEL: '${SALT_MINION_LOG_LEVEL}'
      SALTBOX_BRIDGE_LOG_LEVEL: '${SALTBOX_BRIDGE_LOG_LEVEL:-info}'
    secrets:
      - redis_salt_password
    ports:
      - '4505-4506:4505-4506'
    volumes:
      - '${SALT_MASTER_STORAGE_PATH}:/srv/salt/'
      - '${SSHFS_STORAGE_PATH}:/srv/sshfs/'
      - 'redis_salt_certs:/etc/redis/certs/:ro'
      - 'salt_master_pki:/etc/salt/pki/'
      - 'salt_master_saltbox_var:/var/lib/saltbox-bridge/'
    depends_on:
      redis-salt:
        condition: service_healthy
        restart: false

  make-redis-salt-certs:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/make-certs:${MAKE_CERTS_IMAGE_TAG}'
    entrypoint: 'sh make-redis-salt-certs.sh'
    volumes:
      - 'redis_salt_certs:/mnt/redis_certs/'
      - './make-certs/redis_salt_hier.yaml.tpl:/root/redis_salt_hier.yaml.tpl:ro'
      - './make-certs/make-redis-salt-certs.sh:/root/make-redis-salt-certs.sh:ro'
    secrets:
      - redis_salt_ca_private_key_password
      - redis_salt_private_key_password

  redis-salt:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/redis:${REDIS_IMAGE_TAG}'
    environment:
      REDIS_ENCRYPTION: 'on'
      TLS_AUTH_CLIENT: optional
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      REDIS_PASSWORD_SECRET_FILE: '/run/secrets/redis_salt_password'
      REDIS_PRIVATE_KEY_PASSWORD_SECRET: '/run/secrets/redis_salt_private_key_password'
    command:
      - --save 60 1
    healthcheck:
      test: >
        redis-cli --tls
        --user ${REDIS_SALT_USERNAME}
        --pass "$(cat "$$REDIS_PASSWORD_SECRET_FILE")"
        --cacert /etc/redis/certs/ca.crt ping
      start_period: '20s'
      start_interval: '2s'
      interval: '15s'
      retries: 3
    volumes:
      - 'redis_salt_data:/data/'
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    expose:
      - 6379
    ports:
      - '${REDIS_SALT_EXPOSE_SOCKET}:6379'
    secrets:
      - redis_salt_password
      - redis_salt_private_key_password
    depends_on:
      - make-redis-salt-certs

  redis-taskiq:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/redis:${REDIS_IMAGE_TAG}'
    environment:
      REDIS_ENCRYPTION: 'off'
      REDIS_USERNAME: ${REDIS_TASKIQ_USERNAME}
      REDIS_PASSWORD_SECRET_FILE: '/run/secrets/redis_taskiq_password'
    command:
      - --save 60 1
    volumes:
      - 'redis_taskiq_data:/data/'
    expose:
      - 6379
    secrets:
      - redis_taskiq_password

  rabbitmq:
    <<: *default
    image: rabbitmq:3-management
    expose:
      - 5672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  saltbox-gateway:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-gateway:${GATEWAY_IMAGE_TAG}'
    command: 'uvicorn'
    environment:
      LOG_LEVEL: '${GATEWAY_LOG_LEVEL:-info}'
      # BASE_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}'
      SERVER_SCHEME: '${WEB_SERVER_SCHEME}'
      SERVER_WS_SCHEME: '${WEB_SERVER_WS_SCHEME}'
      SERVER_OUTER_SOCKET: '${WEB_SERVER_OUTER_SOCKET}'
      REDIS_CA_CERT: '/etc/redis/certs/ca.crt'
      REDIS_URL: 'rediss://redis-salt:6379/0'
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      TIMEOUT_GRACEFUL_SHUTDOWN: '${GATEWAY_SHUTDOWN_TIMEOUT_SEC}'
      GATEWAY_HTTP_PORT: '${GATEWAY_HTTP_PORT}'
      UVICORN_WORKERS: '${GATEWAY_WORKERS:-1}'
      KEYCLOAK_FRONT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}'
      KEYCLOAK_SERVER_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      BASIC_AUTH_USERNAME: '${BASIC_AUTH_USERNAME:-}'
      BASIC_AUTH_PASSWORD: '${BASIC_AUTH_PASSWORD:-}'
      OPA_URL: 'http://opa:8181'
    volumes:
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
    secrets:
      - redis_salt_password
      - keycloak_client_saltbox_core_password
    expose:
      - ${GATEWAY_HTTP_PORT}
    depends_on:
      redis-salt:
        condition: service_healthy
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core: &core
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-core:${CORE_IMAGE_TAG}'
    command: 'uvicorn'
    environment:
      BASE_URL_ROOT_PATH: '${BACKEND_PATH}'
      BASIC_AUTH_PASSWORD: '${BASIC_AUTH_PASSWORD:-}'
      BASIC_AUTH_USERNAME: '${BASIC_AUTH_USERNAME:-}'

      # Gateway environment variables
      DISCOVERY_DISCOVERY_URL: 'http://saltbox-gateway:${GATEWAY_HTTP_PORT}/api/discovery'
      DISCOVERY_FRONT_CONTAINER_NAME: '${CORE_FRONT_CONTAINER_NAME}'
      DISCOVERY_FRONT_CONTAINER_PORT: '${CORE_FRONT_CONTAINER_PORT}'
      DISCOVERY_INSTANCE_HOST: '${CORE_HOST}'
      DISCOVERY_INSTANCE_PORT: '${CORE_PORT}'
      DISCOVERY_SERVER_OUTER_SOCKET: '${WEB_SERVER_OUTER_SOCKET}'
      DISCOVERY_SERVER_SCHEME: '${WEB_SERVER_SCHEME}'
      DISCOVERY_SERVER_WS_SCHEME: '${WEB_SERVER_WS_SCHEME}'
      DISCOVERY_SERVICE_DESCRIPTION: '${CORE_SERVICE_DESCRIPTION}'
      DISCOVERY_SERVICE_NAME: '${CORE_SERVICE_NAME}'
      DISCOVERY_SERVICE_TITLE: '${CORE_SERVICE_TITLE}'
      DISCOVERY_SERVICE_TYPE: '${CORE_SERVICE_TYPE}'
      DISCOVERY_SERVICE_VENDOR: '${CORE_SERVICE_VENDOR}'

      GITFS_USER: 'git'  # As in users.json of sshfs
      KEYCLOAK_CLIENT: '${KEYCLOAK_CLIENT}'
      KEYCLOAK_FRONT_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM}'
      KEYCLOAK_SERVER_URL: 'http://keycloak:8080${KEYCLOAK_BASE_URL}'
      LOG_LEVEL: '${SALTBOX_CORE_LOG_LEVEL}'
      MODULE_INVENTORY_ON: '${SALTBOX_MODULE_INVENTORY_ON:-false}'
      MONGO_DB: '${MONGO_DB}'
      MONGO_USER: '${MONGO_USER}'
      OPA_URL: 'http://opa:8181'
      REDIS_CA_CERT: '/etc/redis/certs/ca.crt'
      REDIS_TASKIQ_DB: 0
      REDIS_TASKIQ_HOST: redis-taskiq
      REDIS_TASKIQ_PASSWORD_SECRET: '/run/secrets/redis_taskiq_password'
      REDIS_TASKIQ_PORT: 6379
      REDIS_TASKIQ_USERNAME: '${REDIS_TASKIQ_USERNAME}'
      REDIS_URL: 'rediss://redis-salt:6379/0'
      REDIS_USERNAME: '${REDIS_SALT_USERNAME}'
      SALT_FUNC_REPO_URL: '${SALT_FUNC_REPO_URL}'
      SALT_MODULES_SERVE_DIR: '/mnt/salt/'
      SHOW_DOCS: '${SHOW_DOCS:-false}'
      SSHFS_USER: 'saltbox'  # As in users.json of sshfs
      TIMEOUT_GRACEFUL_SHUTDOWN: '${BACKEND_SHUTDOWN_TIMEOUT_SEC}'
    volumes:
      - type: volume
        source: redis_salt_certs
        target: '/etc/redis/certs/'
        read_only: true
      - 'saltbox_core_var:/var/lib/saltbox-core/'
      - 'salt_repos:/mnt/salt/'
      - '${SSHFS_STORAGE_PATH}:/srv/sshfs/'
    secrets:
      - redis_taskiq_password
      - redis_salt_password
      - mongo_admin_password
      - keycloak_client_saltbox_core_password
    expose:
      - ${BACKEND_HTTP_PORT}
    depends_on:
      mongo:
        condition: service_started
        restart: false
      redis-salt:
        condition: service_healthy
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-faststream-redis:
    <<: *core
    command: 'shell saltbox-faststream-redis'
    expose: []
    depends_on:
      redis-salt:
        condition: service_started
        restart: false

  saltbox-core-faststream-rabbit:
    <<: *core
    command: 'shell saltbox-faststream-rabbit'
    expose: []
    depends_on:
      redis-salt:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-tasks-watcher:
    <<: *core
    command: 'shell saltbox-tasks-watcher'
    expose: []
    depends_on:
      redis-salt:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-taskiq-worker:
    <<: *core
    command: 'taskiq-worker'
    ports: []
    depends_on:
      redis-taskiq:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-core-taskiq-scheduler:
    <<: *core
    command: 'taskiq-scheduler'
    ports: []
    depends_on:
      redis-taskiq:
        condition: service_started
        restart: false
      rabbitmq:
        condition: service_healthy
        restart: false

  saltbox-frontend-root-config:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-frontend-root-config:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  saltbox-frontend-base:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-frontend-base:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  saltbox-frontend-gateway:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-frontend-gateway:${FRONTEND_IMAGE_TAG}'
    expose:
      - ${FRONTEND_HTTP_PORT}

  saltbox-frontend-core:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-frontend-core:${FRONTEND_IMAGE_TAG}'
    ports:
      - 8003:80
    expose:
      - ${FRONTEND_HTTP_PORT}

  mongo:
    <<: *default
    image: mongo:7
    command: --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin_password
    ports:
      - '${MONGO_EXPOSE_SOCKET}:27017'
    volumes:
      - mongo_config:/data/configdb
      - mongo_data:/data/db
    secrets:
      - mongo_admin_password

  opa:
    image: '${IMAGE_REGISTRY}/saltbox-compose/opa:${OPA_IMAGE_TAG}'
    command:
      - 'run'
      - '--server'
      - '--addr=0.0.0.0:8181'
      - '--watch'
      - '--log-format=json-pretty'
      - '--log-level=${OPA_LOG_LEVEL:-info}'
      - '--set=decision_logs.console=false'
      - '/policies/'
    ports:
      - '8181:8181'

  sshfs:
    <<: *default
    image: '${IMAGE_REGISTRY}/saltbox-compose/sshfs:${SSHFS_IMAGE_TAG}'
    environment:
      SSHFS_USER: '${SSHFS_USER}'
      USERS_FILE: '/mnt/sshfs_users.json'
      AUTHORIZED_KEYS_URL: 'http://saltbox-core:${BACKEND_HTTP_PORT}/system/$${user}/authorized_keys'
    secrets:
      - sshfs_user_saltbox_password
      - sshfs_user_master_password
    ports:
      - '${SSHFS_EXPOSE_SOCKET:-1022}:1022'
    volumes:
      - '${SSHFS_STORAGE_PATH}:/srv/sshfs/'
      - 'salt_repos:/srv/master/salt/'
      - './sshfs_conf/users.json:/mnt/sshfs_users.json:ro'

  grafana:
    <<: *default
    image: grafana/grafana:12.0.2-security-01 #TODO: add to registry
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_AUTH_BASIC_ENABLED: false
      GF_AUTH_DISABLE_LOGIN_FORM:  true
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: true
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true
      GF_AUTH_GENERIC_OAUTH_USE_TOKEN_INFO_ENDPOINT: false
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: '${KEYCLOAK_CLIENT_GRAFANA}'
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: 'full_name'
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: 'username'
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: 'email'
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: '/run/secrets/keycloak_client_grafana_password'
      GF_AUTH_GENERIC_OAUTH_SCOPES: 'openid email profile offline_access roles'
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: '${WEB_SERVER_SCHEME}://${WEB_SERVER_OUTER_SOCKET}${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth'
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: '${WEB_SERVER_SCHEME}://keycloak:8080${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token'
      GF_AUTH_GENERIC_OAUTH_API_URL: '${WEB_SERVER_SCHEME}://keycloak:8080${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(resource_access.grafana.roles, 'grafana_admin') && 'Admin' || 'Viewer'"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/etc/grafana/provisioning/dashboards/dashboard.json'
      GF_LOG_LEVEL: '${BACKEND_LOG_LEVEL}'
    secrets:
      - keycloak_client_grafana_password
    ports:
      - '3000:3000'
    volumes:
      - './grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json'
      - './grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml'
      - './grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml'
      - 'grafana_data:/var/lib/grafana'
    depends_on:
      grafana-loki:
        condition: service_healthy
      promtail:
        condition: service_healthy
      prometheus:
        condition: service_started


  grafana-loki:
    <<: *default
    image: grafana/loki:3.4.5 #TODO: add to registry
    environment:
      TZ: '${GRAFANA_SYSTEM_TIMEZONE}'
    expose:
      - '3100'
    volumes:
      - './grafana-loki.yaml:/etc/loki/config.yaml'
      - 'grafana_loki_config:/etc/loki'
    healthcheck:
      test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  promtail:
    <<: *default
    image: grafana/promtail:3.4.5 #TODO: add to registry
    command:
      - '-config.expand-env=true'
      - '-config.file=/etc/promtail/config.yaml'
    expose:
      - '9080'
    volumes:
      - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './promtail.yaml:/etc/promtail/config.yaml'
      - 'promtail_data:/etc/promtail'
    healthcheck:
          test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/9080; exit $?;'"]
          start_period: 10s
          interval: 10s
          timeout: 5s
          retries: 3

  prometheus:
      <<: *default
      image: prom/prometheus:v3.5.0 #TODO: add to registry
      ports:
        - '9090:9090'
      volumes:
        - './prometheus.yml:/etc/prometheus/prometheus.yml'
        - 'prometheus_data:/data/prometheus'

configs: {}

volumes:
  keycloak-db_data: {}
  mongo_config: {}
  mongo_data: {}
  redis_salt_certs: {}
  redis_salt_data: {}
  redis_taskiq_certs: {}
  redis_taskiq_data: {}
  salt_master_pki: {}
  salt_master_saltbox_var: {}
  salt_repos: {}
  saltbox_core_var: {}
  grafana_data: {}
  grafana_loki_config: {}
  promtail_data: {}
  prometheus_data: {}

secrets:
  keycloak_admin_password:
    file: secrets/keycloak_admin_password
  keycloak_client_saltbox_core_password:  # Not private: exposed in /env.json
    file: secrets/keycloak_client_saltbox_core_password
  keycloak_database_password:
    file: secrets/keycloak_database_password
  mongo_admin_password:
    file: secrets/mongo_admin_password
  redis_salt_ca_private_key_password:
    file: secrets/redis_salt_ca_private_key_password
  redis_salt_password:
    file: secrets/redis_salt_password
  redis_salt_private_key_password:
    file: secrets/redis_salt_private_key_password
  redis_taskiq_password:
    file: secrets/redis_taskiq_password
