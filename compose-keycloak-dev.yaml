---

x-keycloak-service:
    pull_policy: never
    develop:
      watch:
        - action: rebuild
          path: keycloak/


services:
  keycloak:
    build:
      context: keycloak
      target: keycloak
      args:
        BASE_KEYCLOAK_IMG: "${IMAGE_REGISTRY}/saltbox/saltbox-compose/keycloak-base:master"
        KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_BASE_URL}
    image: '${LOCAL_IMAGE_NAMESPACE}/keycloak:dev'

  keycloak-init:
    build:
      context: keycloak
      target: keycloak-init
      args:
        BASE_KEYCLOAK_IMG: "${IMAGE_REGISTRY}/saltbox/saltbox-compose/keycloak-base:master"
        KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_BASE_URL}
    image: '${LOCAL_IMAGE_NAMESPACE}/keycloak-init:dev'
