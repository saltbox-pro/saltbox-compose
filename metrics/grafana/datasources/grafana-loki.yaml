auth_enabled: false

server:
  http_listen_port: 3100

ui:
  enabled: false

analytics:
  reporting_enabled: false # enable anonymous usage reporting

common:
  ring:
    instance_addr: grafana-loki:3100 
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
  - from: 2020-05-15
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: index_
      period: 24h

storage_config:
  filesystem:
    directory: /tmp/loki/chunks

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h # 7 day (default=0h)
