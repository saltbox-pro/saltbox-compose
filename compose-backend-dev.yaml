---

## Salt.Box Compose backend override file for dev-mode.

x-redis-based: &redis
  build:
    context: redis/
  image: 'redis-saltbox:dev'

services:
  keycloak-init:
    environment:
      KEYCLOAK_CLIENT_DIRECT_ACCESS: 'true'

  saltbox-core: &core
    build:
      context: $CORE_BUILD_DIR
      target: dev
    environment:
      - SHOW_DOCS=True
    tty: true  # colorize logs
    image: 'saltbox-core:dev'
    volumes:
      - '${CORE_BUILD_DIR}:/mnt/saltbox-core'
      - '${BRIDGE_MESSAGES_DIR}:/mnt/saltbox-bridge-messages'

  saltbox-core-faststream-redis:
    <<: *core

  saltbox-core-tasks-watcher:
    <<: *core

  saltbox-core-taskiq-worker:
    <<: *core

  saltbox-core-taskiq-scheduler:
    <<: *core

  redis-salt:
    <<: *redis

  redis-taskiq:
    <<: *redis
    ports:
      - 6380:6379

  rabbitmq:
    ports:
      - 5672:5672
      - 15672:15672

  opa:
    image: openpolicyagent/opa:latest-istio-static
    volumes:
      - './opa/policies:/policies'
