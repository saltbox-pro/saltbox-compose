---

## salt.box compose backend override file for dev-mode.

services:
  salt-box-core: &core
    build:
      context: $CORE_BUILD_DIR
      target: dev
    image: 'salt-box-core:dev'
    volumes:
      - '${CORE_BUILD_DIR}:/mnt/salt_box_core'
  salt-box-core-celery-beat:
    <<: *core
  salt-box-core-celery-worker-tasks:
    <<: *core
  redis-salt:
    build:
      context: redis/
    image: 'redis-salt:dev'
