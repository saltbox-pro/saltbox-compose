---

## FastMS Compose backend override file for dev-mode.

services:
  fastms-core:
    build:
      context: $CORE_BUILD_DIR
      target: dev
    image: 'fastms-core:dev'
    volumes:
      - '${CORE_BUILD_DIR}:/mnt/fastms_core'
  redis-salt:
    build:
      context: redis/
    image: 'redis-salt:dev'
    ports:
      - '6379:6379'
  mongo:
    ports:
      - ${MONGO_PORT:-27017}:${MONGO_PORT:-27017}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongo_data: {}
  mongo_config: {}
