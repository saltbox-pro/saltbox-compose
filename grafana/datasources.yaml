apiVersion: 1

datasources:
  - name: Loki # name of the data source
    type: loki
    access: proxy # proxy or direct (Server or Browser in the UI)
    orgId: 1
    url: http://grafana-loki:3100
    basicAuth: false
    isDefault: true # it's the default data source
    version: 1
    editable: false # allows users to edit data sources from the grafana UI 
