[project]
name = "saltbox-compose-scripts"
requires-python = ">=3.7.3"
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = [
    "ipython",
    "mypy",
    "pylsp-mypy",
    "python-lsp-server[all]",
    "ruff",
]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["bin"]

[tool.flake8]
max-line-length = 120
extend-ignore = [ ]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
preview = true
select=[
    "ASYNC", "DTZ", "E", "F", "G", "I", "LOG", "N", "RUF", "SIM", "UP", "W",
]
ignore = [
    "B019",
    "SIM108",  # Annoying ternary op suggestion
]

[tool.ruff.format]
quote-style = "single"
