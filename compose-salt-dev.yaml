---

## salt.box compose SaltStack override file for dev-mode.
#
# Local generic does not override original
x-default-service: &default
  restart: 'on-failure'
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  # Override
  salt-master:
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-master
    image: 'salt-master:dev'
    develop:
      watch:
        - path: '${SALT_BUILD_DIR}/docker/templates/'
          action: 'sync+restart'
          target: '/root/templates/'
        - path: '${SALT_BUILD_DIR}/docker/entrypoint.sh'
          action: 'sync+restart'
          target: '/usr/local/bin/entrypoint.sh'
        - path: '${SALT_BUILD_DIR}/engines/'
          action: 'sync+restart'
          target: '/srv/salt_extmod/engines/'
        - path: '${SALT_BUILD_DIR}/runners/'
          action: 'sync+restart'
          target: '/srv/salt_extmod/runners/'
        - path: '${SALT_BUILD_DIR}/salt_box_bridge_service/'
          action: 'rebuild'
        - path: '${SALT_BUILD_DIR}/pyproject.toml'
          action: 'rebuild'
        - path: '${SALT_BUILD_DIR}/requirements.txt'
          action: 'rebuild'
    ports:
      - '4505-4506:4505-4506'
      - '8001:8000'

  # Additional services
  clean-keys-cmd:
    <<: *default
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-master
    image: 'salt-master:dev'
    restart: 'on-failure:3'
    entrypoint: 'salt-key --delete-all --yes'
    profiles:
      - salt-master
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
  salt-minion:
    <<: *default
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-minion
    image: 'salt-minion:dev'
    develop:
      watch:
        - path: 'salt/minion/minion.yaml'
          action: 'sync+restart'
          target: '/etc/salt/minion.d/minion.conf'
    deploy:
      mode: replicated
      replicas: '${SALT_MINION_REPLICAS:-1}'
    profiles:
      - salt-master
    depends_on:
      clean-keys-cmd:
        condition: service_completed_successfully
        required: false
        restart: true
      salt-master:
        condition: service_started
        restart: false
