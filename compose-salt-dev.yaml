---

## FastMS Compose SaltStack override file for dev-mode.
#
# Local generic does not override original
x-default-service: &default
  restart: unless-stopped
  stop_grace_period: ${STOP_GRACE_PERIOD}
  env_file:
    - .env

services:
  # Override
  salt-master:
    build:
      context: salt/
      target: salt-master
    image: 'salt-master:dev'
    develop:
      watch:
        - action: rebuild
          path: salt/
    ports:
      - '4505-4506:4505-4506'
      - '8001:8000'

  # Additional services
  clean-keys-cmd:
    pull_policy: never
    image: fastms-salt-master
    command: 'salt-key --delete-all --yes'
    profiles:
      - salt-master
    depends_on:
      salt-master:
        restart: true
        condition: service_started
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
  salt-minion:
    <<: *default
    build:
      context: salt/
      target: salt-minion
    init: true
    develop:
      watch:
        - action: rebuild
          path: salt/
    deploy:
      mode: replicated
      replicas: ${SALT_MINION_REPLICAS:-1}
    profiles:
      - salt-master
    depends_on:
      clean-keys-cmd:
        restart: true
        condition: service_completed_successfully
