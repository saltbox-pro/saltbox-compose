---

## salt.box compose SaltStack override file for dev-mode.
#
# Local generic does not override original
x-default-service: &default
  restart: 'on-failure'
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  # Override
  salt-master:
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-master
    image: 'salt-master:dev'
    develop:
      watch:
        - path: 'salt/templates/'
          action: 'sync+restart'
          target: '/root/templates/'
        - path: 'salt/config/supervisor.conf'
          action: 'sync+restart'
          target: '/etc/supervisor.conf'
        - path: 'salt/config/netapi.conf'
          action: 'sync+restart'
          target: '/etc/salt/master.d/netapi.conf'
        - path: 'salt/engines/redis_bridge.py'
          action: 'sync+restart'
          target: '/src/salt_extmod/engines/redis_bridge.py'
        - path: 'salt/service/'
          action: 'sync+restart'
          target: '/srv/salt_service/'
        - path: 'salt/prepare_configs.sh'
          action: 'sync+restart'
          target: '/usr/local/bin/prepare_configs.sh'
    ports:
      - '4505-4506:4505-4506'
      - '8001:8000'
    depends_on:
      clean-keys-cmd:
        condition: service_completed_successfully
        required: false
        restart: false

  # Additional services
  clean-keys-cmd:
    <<: *default
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-master
    image: 'salt-master:dev'
    restart: 'on-failure:3'
    command: 'salt-key --delete-all --yes'
    profiles:
      - salt-master
    volumes:
      - 'salt_master_pki:/etc/salt/pki/'
  salt-minion:
    <<: *default
    build:
      context: '${SALT_BUILD_DIR}'
      target: salt-minion
    image: 'salt-minion:dev'
    develop:
      watch:
        - path: 'salt/minion/minion.yaml'
          action: 'sync+restart'
          target: '/etc/salt/minion.d/minion.conf'
    deploy:
      mode: replicated
      replicas: '${SALT_MINION_REPLICAS:-1}'
    profiles:
      - salt-master
    depends_on:
      clean-keys-cmd:
        condition: service_completed_successfully
        required: false
        restart: true
