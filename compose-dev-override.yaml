services:
  salt-master:
    ports:
      - '4505-4506:4505-4506'
      - '8001:8000'
    develop:
      watch:
        - action: rebuild
          path: salt/
  fastms-core:
    develop:
      watch:
        - action: rebuild
          path: fastms-core/
  redis-salt:
    ports:
      - '6379:6379'
  mongo-express:
    image: mongo-express:1
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      # TODO update user:pass
      ME_CONFIG_MONGODB_URL: 'mongodb://root:example@mongo:27017/'
      ME_CONFIG_BASICAUTH: false
  salt-minion:
    build:
      context: salt/
      target: salt-minion
    init: true
    develop:
      watch:
        - action: rebuild
          path: salt/
    deploy:
      mode: replicated
      replicas: ${MINION_REPLICAS:-1}
