---

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


.default:
  extends: .build-image
  dependencies: []


.build-redis-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'


.build-nginx-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/nginx'
    CONTEXT_PATH: 'nginx/'


.build-proxy-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/proxy'
    CONTEXT_PATH: 'proxy/'


.opa:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/opa'
    CONTEXT_PATH: 'opa/'


.sshfs:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/sshfs'
    CONTEXT_PATH: 'sshfs/'


.make-certs:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/make-certs'
    CONTEXT_PATH: 'make-certs/'


.mongodb:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/mongodb'
    CONTEXT_PATH: 'mongodb/'


Build Redis image for tag:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Redis image for branch:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Nginx image for tag:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Nginx image for branch:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Proxy image for tag:
  extends: .build-proxy-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Proxy image for branch:
  extends: .build-proxy-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Trigger Keycloak build:
  trigger:
    include: 'keycloak/.gitlab-ci.yml'
  rules:
    - changes:
        - 'keycloak/**/*'


Build OPA image for tag:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build OPA image for branch:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build SSHFS image for tag:
  extends: .sshfs
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build SSHFS image for branch:
  extends: .sshfs
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build make-certs image for tag:
  extends: .make-certs
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build make-certs image for branch:
  extends: .make-certs
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build MongoDB image for tag:
  extends: .mongodb
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build MongoDB image for branch:
  extends: .mongodb
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
