---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'


.build-redis-image:
  extends: .build-image
  variables:
    REGISTRY_ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'


.build-nginx-image:
  extends: .build-image
  variables:
    REGISTRY_ADDITIONAL_PATH: '/nginx'
    CONTEXT_PATH: 'nginx/'


.build-keycloak-image:
  extends: .build-image
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak'
    CONTEXT_PATH: 'keycloak/'
    TARGET: keycloak


.build-keycloak-init-image:
  extends: .build-image
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak-init'
    CONTEXT_PATH: 'keycloak/'
    TARGET: keycloak-init


Build Redis image for tag:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Redis image for branch:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Nginx image for tag:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Nginx image for branch:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Keycloak image for tag:
  extends: .build-keycloak-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Keycloak image for branch:
  extends: .build-keycloak-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build keycloak-init image for tag:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build keycloak-init image for branch:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
