---

.build:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG || true
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG
      --tag $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$CI_COMMIT_SHA
      --tag $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG
      .
    - docker push $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG


Build Redis for tag:
  extends: .build
  variables:
    ADDITIONAL_PATH: /redis
    IMAGE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG


Build Redis image for branch:
  extends: .build
  variables:
    ADDITIONAL_PATH: /redis
    IMAGE_TAG: $CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH
