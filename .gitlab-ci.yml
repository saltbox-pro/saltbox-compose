---

.build:
  variables:
    CONTEXT_PATH: '.'
    ADDITIONAL_PATH: ''
    TARGET: ''
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG || true
    - >
      docker build
      --target '$TARGET'
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG
      --tag $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$CI_COMMIT_SHA
      --tag $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG
      "$CONTEXT_PATH" 
    - docker push $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE$ADDITIONAL_PATH:$IMAGE_TAG


Build Redis image for tag:
  extends: .build
  variables:
    ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'
    IMAGE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG


Build Redis image for branch:
  extends: .build
  variables:
    ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'
    IMAGE_TAG: $CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH


Build salt-master for tag:
  extends: .build
  variables:
    TARGET: salt-master
    ADDITIONAL_PATH: '/salt-master'
    CONTEXT_PATH: 'salt/'
    IMAGE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG


Build salt-master image for branch:
  extends: .build
  variables:
    TARGET: salt-master
    ADDITIONAL_PATH: '/salt-master'
    CONTEXT_PATH: 'salt/'
    IMAGE_TAG: $CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH
