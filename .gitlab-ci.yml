---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'


# FIXME Independend pipelines for multistage
stages:
  - stage-0
  - stage-1
  - stage-2

.default:
  extends: .build-image
  stage: stage-0
  dependencies: []


.build-redis-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'


.build-nginx-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/nginx'
    CONTEXT_PATH: 'nginx/'


.build-keycloak-base-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak-base'
    DOCKERFILE: 'keycloak/base.Dockerfile'
    CONTEXT_PATH: 'keycloak/'


.build-keycloak-image:
  extends: .default
  stage: stage-1
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak'
    CONTEXT_PATH: 'keycloak/'
    TARGET: keycloak


.build-keycloak-init-image:
  extends: .default
  stage: stage-2
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak-init'
    CONTEXT_PATH: 'keycloak/'
    TARGET: keycloak-init


.opa:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/opa'
    CONTEXT_PATH: 'opa/'


Build Redis image for tag:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Redis image for branch:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Nginx image for tag:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Nginx image for branch:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build keycloak-base image for tag:
  extends: .build-keycloak-base-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build keycloak-base image for branch:
  extends: .build-keycloak-base-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'

Build Keycloak image for tag:
  extends: .build-keycloak-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Keycloak image for branch:
  extends: .build-keycloak-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build keycloak-init image for tag:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build keycloak-init image for branch:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build OPA image for tag:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build OPA image for branch:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
