---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'


.default:
  extends: .build-image
  dependencies: []


.build-redis-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'


.build-nginx-image:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/nginx'
    CONTEXT_PATH: 'nginx/'


.opa:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/opa'
    CONTEXT_PATH: 'opa/'


.sshfs:
  extends: .default
  variables:
    REGISTRY_ADDITIONAL_PATH: '/sshfs'
    CONTEXT_PATH: 'sshfs/'


Build Redis image for tag:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Redis image for branch:
  extends: .build-redis-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build Nginx image for tag:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build Nginx image for branch:
  extends: .build-nginx-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Trigger Keycloak build:
  trigger:
    include: 'keycloak/.gitlab-ci.yml'
  rules:
    - changes:
        - 'keycloak/*'


Build OPA image for tag:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build OPA image for branch:
  extends: .opa
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build SSHFS image for tag:
  extends: .sshfs
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build SSHFS image for branch:
  extends: .sshfs
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
