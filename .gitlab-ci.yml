---

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'
  - project: 'saltbox/ci-lib'
    file: 'mirror-image.yml'
  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'


Build Redis image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/redis'
    CONTEXT_PATH: 'redis/'


Build OPA image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/opa'
    CONTEXT_PATH: 'opa/'


Build SSHFS image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/sshfs'
    CONTEXT_PATH: 'sshfs/'


Build make-certs image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/make-certs'
    CONTEXT_PATH: 'make-certs/'


Build MongoDB image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/mongodb'
    CONTEXT_PATH: 'mongodb/'


Build RabbitMQ image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/rabbitmq'
    CONTEXT_PATH: 'rabbitmq/'


Build Keycloak image:
  extends: .build-image
  stage: build
  variables:
    REGISTRY_ADDITIONAL_PATH: '/keycloak'
    CONTEXT_PATH: 'keycloak/'
    TARGET: keycloak


Mirror Postgres image:
  extends: .mirror-image
  stage: build
  variables:
    SOURCE_IMAGE: 'postgres:16-alpine'
    REGISTRY_ADDITIONAL_PATH: '/postgres-16-alpine'


Trigger Proxy build:
  stage: build
  trigger:
    include:
      - local: 'proxy/.gitlab-ci.yml'
    strategy: depend


Check release image tags:
  stage: .pre
  image: python:3.13-alpine
  variables:
    GITLAB_TOKEN: '$CI_JOB_TOKEN'
    APK_CACHE_DIR: '$CI_PROJECT_DIR/.cache/apk'
    PYTHONUNBUFFERED: 'True'
    SALTBOX_INSTALL_TOKEN_HEADER: 'JOB-TOKEN'
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" bash coreutils docker-compose git jq
    - rm -f override.env
    - |
      set -e
      extra_env=''
      paths="$(bin/install_saltbox.py --list-addons | jq -r '.[].base_dir')"
      for repo in $paths; do
        url="${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}"
        url="${url}@${CI_SERVER_HOST}:${CI_SERVER_PORT}"
        url="${url}/saltbox/${repo}"
        git -C .. clone --depth=1 --branch=dev "$url"
        extra_env="${extra_env}:../${repo}/.env"
        echo "COMPOSE_FILE=\"\${COMPOSE_FILE}:../${repo}/compose.yaml\"" >> override.env
      done
      echo "_UPDATE_AND_RUN_EXTRA_ENV_FILES=\"${extra_env#:}\"" >> override.env
    - cat override.env
  script:
    - bin/image_tags.py check
  cache:
    paths:
      - '$APK_CACHE_DIR'
  rules:
    - if: '$CI_COMMIT_TAG && $TEST_IMAGE_TAGS == true'
